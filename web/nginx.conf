server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls directly to the Core Engine backend service
    location /api/ {
        proxy_pass http://core-engine:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    # ✅ SSE stream ke liye special settings
    location /api/stream {
        proxy_pass http://core-engine:8000/api/stream;
        proxy_http_version 1.1;
        
        # SSE ke liye buffering off
        proxy_buffering off;
        proxy_cache off;
        
        # Timeout badhao (SSE long-lived hota hai)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Connection header sahi set karo
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        
        # CORS headers
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
}
